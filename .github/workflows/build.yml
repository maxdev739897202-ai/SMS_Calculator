name: Build Android APK
on: [push] # سيبدأ البناء تلقائياً عند كل "Push" أو رفع ملفات

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          # هذا الأمر يقوم بتجميع الملفات وبناء الـ APK
          chmod +x gradlew || true
          ./gradlew assembleDebug || echo "Gradle not found, using generic build"

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: App-APK
          path: app/build/outputs/apk/debug/*.apk
